# ============================================================
# TransitOps Fleet Command - application.properties
# ============================================================

# --- Server ---
server.port=8080

# --- MySQL connection ---
# Update username/password to match your local MySQL install.
# createDatabaseIfNotExist=true means you do NOT need to manually create the
# "transitops_db" schema - MySQL will create it the first time Spring Boot
# connects, as long as the MySQL user has CREATE privileges.
spring.datasource.url=jdbc:mysql://localhost:3306/transitops_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update makes Hibernate create/update all required tables
# (vehicles, drivers, trips, maintenance_records, fuel_logs, expenses, users)
# automatically on startup, based on the @Entity classes. No manual SQL needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Jackson (JSON) ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Static frontend ---
# index.html / app.js / styles.css live in src/main/resources/static and are
# served automatically by Spring Boot at http://localhost:8080/
spring.web.resources.static-locations=classpath:/static/
